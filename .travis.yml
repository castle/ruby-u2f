services:
  - docker

dist: trusty
sudo: false
cache: bundler

git:
  depth: false

test: &test
  stage: test
  language: ruby
  before_install:
    - gem install bundler
    - gem update --system

jobs:
  include:
    - <<: *test
      rvm: 2.6.5
    - <<: *test
      rvm: 2.5.7
    - <<: *test
      rvm: 2.4.8

stages:
  - test
